openapi: 3.0.3
info:
  title: OpenRepo API
  version: 2.8.0
  description: Package repository management API for Debian APT, RPM, and generic
    repositories.
paths:
  /api/{repo_uid}/:
    get:
      operationId: root_retrieve
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoDetail'
          description: ''
    put:
      operationId: root_update
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepoDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RepoDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RepoDetailRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoDetail'
          description: ''
    delete:
      operationId: root_destroy
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/{repo_uid}/packages/:
    get:
      operationId: packages_list
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - packages
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPackageSummaryList'
          description: ''
  /api/{repo_uid}/pkg/{package_uid}/:
    get:
      operationId: pkg_retrieve
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - in: path
        name: package_uid
        schema:
          type: string
        required: true
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - pkg
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDetail'
          description: ''
    put:
      operationId: pkg_update
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - in: path
        name: package_uid
        schema:
          type: string
        required: true
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - pkg
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PackageDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PackageDetailRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDetail'
          description: ''
    delete:
      operationId: pkg_destroy
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - in: path
        name: package_uid
        schema:
          type: string
        required: true
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - pkg
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/{repo_uid}/pkg/{package_uid}/copy/:
    post:
      operationId: pkg_copy_create
      description: Copy a package to another repository.
      parameters:
      - in: path
        name: package_uid
        schema:
          type: string
        required: true
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - pkg
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CopyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CopyRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDetail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/{repo_uid}/upload/:
    post:
      operationId: upload_create
      description: Upload a package file. Returns a task ID for async status polling.
        Returns 409 if the package already exists and overwrite is not set.
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/buildlogs/:
    get:
      operationId: buildlogs_list
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - in: query
        name: build
        schema:
          type: integer
      - in: query
        name: loglevel
        schema:
          type: string
      - in: query
        name: max_line
        schema:
          type: integer
      - in: query
        name: max_time
        schema:
          type: string
          format: date-time
      - in: query
        name: min_line
        schema:
          type: integer
      - in: query
        name: min_time
        schema:
          type: string
          format: date-time
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: repo
        schema:
          type: string
      tags:
      - buildlogs
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBuildLogList'
          description: ''
  /api/builds/:
    get:
      operationId: builds_list
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - in: query
        name: build_number
        schema:
          type: integer
      - in: query
        name: completion_status
        schema:
          type: string
          enum:
          - complete_fail
          - complete_success
          - running
        description: |-
          * `running` - Running
          * `complete_success` - Completed Successfully
          * `complete_fail` - Failed
      - in: query
        name: max_build
        schema:
          type: integer
      - in: query
        name: max_time
        schema:
          type: string
          format: date-time
      - in: query
        name: min_build
        schema:
          type: integer
      - in: query
        name: min_time
        schema:
          type: string
          format: date-time
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: repo
        schema:
          type: string
      tags:
      - builds
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBuildList'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: |-
        Unauthenticated health check endpoint.

        Returns database connectivity status and the application version.
        Intended for monitoring systems and load balancer probes.
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 2.5.0
                  repos:
                    type: integer
                    example: 5
                  packages:
                    type: integer
                    example: 142
          description: ''
  /api/repos/:
    get:
      operationId: repos_list
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - repos
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRepoSummaryList'
          description: ''
    post:
      operationId: repos_create
      description: API endpoint that allows groups to be viewed or edited.
      tags:
      - repos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepoDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RepoDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RepoDetailRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoDetail'
          description: ''
  /api/repos/{repo_uid}/:
    get:
      operationId: repos_retrieve
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - repos
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoSummary'
          description: ''
    put:
      operationId: repos_update
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - repos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepoSummaryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RepoSummaryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RepoSummaryRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoSummary'
          description: ''
    patch:
      operationId: repos_partial_update
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - repos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRepoSummaryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRepoSummaryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRepoSummaryRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoSummary'
          description: ''
    delete:
      operationId: repos_destroy
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - repos
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/signingkeys/:
    get:
      operationId: signingkeys_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - signingkeys
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPGPKeyList'
          description: ''
    post:
      operationId: signingkeys_create
      description: Generate a new PGP signing key pair.
      tags:
      - signingkeys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PGPKeyCreateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PGPKeyCreateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PGPKeyCreateRequestRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          description: No response body
  /api/signingkeys/{fingerprint}/:
    get:
      operationId: signingkeys_retrieve
      parameters:
      - in: path
        name: fingerprint
        schema:
          type: string
        required: true
      tags:
      - signingkeys
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PGPKey'
          description: ''
    put:
      operationId: signingkeys_update
      parameters:
      - in: path
        name: fingerprint
        schema:
          type: string
        required: true
      tags:
      - signingkeys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PGPKeyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PGPKeyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PGPKeyRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PGPKey'
          description: ''
    patch:
      operationId: signingkeys_partial_update
      parameters:
      - in: path
        name: fingerprint
        schema:
          type: string
        required: true
      tags:
      - signingkeys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPGPKeyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPGPKeyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPGPKeyRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PGPKey'
          description: ''
    delete:
      operationId: signingkeys_destroy
      parameters:
      - in: path
        name: fingerprint
        schema:
          type: string
        required: true
      tags:
      - signingkeys
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/signingkeys/{fingerprint}/download/:
    get:
      operationId: signingkeys_download_retrieve
      description: Download the public PGP key in ASCII-armored format.
      parameters:
      - in: path
        name: fingerprint
        schema:
          type: string
        required: true
      tags:
      - signingkeys
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/pgp-keys:
              schema:
                type: string
                format: binary
          description: ''
  /api/upload-status/{task_id}/:
    get:
      operationId: upload_status_retrieve
      parameters:
      - in: path
        name: task_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - upload-status
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTask'
          description: ''
  /api/users/:
    get:
      operationId: users_list
      description: API endpoint that allows users to be viewed or edited.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - users
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: users_create
      description: API endpoint that allows users to be viewed or edited.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/{id}/:
    get:
      operationId: users_retrieve
      description: API endpoint that allows users to be viewed or edited.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - users
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: users_update
      description: API endpoint that allows users to be viewed or edited.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: users_partial_update
      description: API endpoint that allows users to be viewed or edited.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: users_destroy
      description: API endpoint that allows users to be viewed or edited.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - users
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/{repo_uid}/:
    get:
      operationId: v1_retrieve
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoDetail'
          description: ''
    put:
      operationId: v1_update
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepoDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RepoDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RepoDetailRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoDetail'
          description: ''
    delete:
      operationId: v1_destroy
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/{repo_uid}/packages/:
    get:
      operationId: v1_packages_list
      description: API endpoint that allows groups to be viewed or edited.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
