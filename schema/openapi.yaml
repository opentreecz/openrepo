          enum:
          - none
          - keep_latest_n
          - max_age_days
          - keep_latest_n_and_age
          type: string
          x-spec-enum-id: dce96f7a3a5fa66a
          description: |-
            Retention strategy (none, keep_latest_n, keep_latest_age, keep_latest_n_and_age).

            * `none` - Keep everything
            * `keep_latest_n` - Keep latest N versions
            * `max_age_days` - Delete packages older than N days
            * `keep_latest_n_and_age` - Keep latest N versions OR delete older than N days
        retention_keep_count:
          type: integer
          nullable: true
          description: Number of versions to keep (when using keep_latest_n policy).
        retention_max_age_days:
          type: integer
          nullable: true
          description: Maximum age in days (when using keep_latest_age policy).
