components:
  schemas:
    Build:
      type: object
      description: Build record for a repository metadata generation run.
      properties:
        id:
          type: integer
          readOnly: true
          description: Build primary key.
        repo_uid:
          type: string
          description: Repository this build belongs to.
        timestamp:
          type: string
          format: date-time
          readOnly: true
          description: When the build started.
        build_number:
          type: integer
          description: Sequential build number within the repository.
        completion_status:
          enum:
          - running
          - complete_success
          - complete_fail
          type: string
          x-spec-enum-id: 3d4790721c6c9fc0
          description: |-
            Build result: running, success, or error.

            * `running` - Running
            * `complete_success` - Completed Successfully
            * `complete_fail` - Failed
        total_duration_sec:
          type: number
          format: double
          nullable: true
          description: Total build duration in seconds.
      required:
      - build_number
      - id
      - repo_uid
      - timestamp
    BuildLog:
      type: object
      description: Individual log line from a build run.
      properties:
        build:
          type: integer
          nullable: true
          description: Build number this log line belongs to.
        timestamp:
          type: string
          format: date-time
          readOnly: true
          description: When the log entry was created.
        command:
          type: string
          description: The command that produced this log line.
        message:
          type: string
          description: Log message content.
        loglevel:
          type: string
          description: 'Severity level: info, warning, or error.'
          maxLength: 128
        line_number:
          type: integer
          description: Sequential line number within the build.
        execution_time_sec:
          type: number
          format: double
          nullable: true
          description: Command execution time in seconds.
        exec_complete:
          type: boolean
          description: Whether the command has finished executing.
      required:
      - command
      - line_number
      - loglevel
      - timestamp
    CopyRequest:
      type: object
      description: Request body for copying a package to another repository.
      properties:
        dest_repo_uid:
          type: string
          minLength: 1
          description: Target repository UID to copy the package to.
      required:
      - dest_repo_uid
    ErrorResponse:
      type: object
      description: Standard error envelope returned by all API error responses.
      properties:
        code:
          type: string
          description: Machine-readable error code (e.g. PACKAGE_EXISTS)
        detail:
          type: string
          description: Human-readable error description
        status:
          type: integer
          description: HTTP status code
      required:
      - code
      - detail
      - status
    PGPKey:
      type: object
      description: PGP signing key metadata.
      properties:
        name:
          type: string
          description: Full name associated with the PGP key.
          maxLength: 65536
        email:
          type: string
          description: Email address associated with the PGP key.
          maxLength: 2048
        fingerprint:
          type: string
          description: 40-character hex PGP key fingerprint.
          maxLength: 65535
        creation_date:
          type: string
          format: date-time
          readOnly: true
          description: When the key was generated.
        href:
          type: string
          format: uri
          readOnly: true
      required:
      - creation_date
      - email
      - fingerprint
      - href
      - name
    PGPKeyCreateRequestRequest:
      type: object
      description: Request body for generating a new PGP signing key.
      properties:
        name:
          type: string
          minLength: 1
          description: Full name for the PGP key (1-1024 characters)
        email:
          type: string
          format: email
          minLength: 1
          description: Email address for the PGP key
      required:
      - email
      - name
    PGPKeyRequest:
      type: object
      description: PGP signing key metadata.
      properties:
        name:
          type: string
          minLength: 1
          description: Full name associated with the PGP key.
          maxLength: 65536
        email:
          type: string
          minLength: 1
          description: Email address associated with the PGP key.
          maxLength: 2048
        fingerprint:
          type: string
          minLength: 1
          description: 40-character hex PGP key fingerprint.
          maxLength: 65535
      required:
      - email
      - fingerprint
      - name
    PackageDetail:
      type: object
      description: Full package detail including checksums and build date.
      properties:
        package_uid:
          type: string
          description: Unique identifier slug for the package.
          maxLength: 65536
        repo_uid:
          type: string
          readOnly: true
          description: Repository this package belongs to.
        package_name:
          type: string
          description: Parsed package name (e.g. 'nginx').
          maxLength: 65536
        filename:
          type: string
          description: Original uploaded filename.
          maxLength: 65536
        version:
          type: string
          description: Package version string.
          maxLength: 65536
        architecture:
          type: string
          description: Target architecture (e.g. amd64, arm64, all).
          pattern: ^[a-zA-Z0-9_.+-]+$
          maxLength: 256
        checksum_sha512:
          type: string
          description: SHA-512 hash of the package file.
          maxLength: 512
        build_date:
          type: string
          format: date-time
          nullable: true
          description: When the package was built (from package metadata).
        upload_date:
          type: string
          format: date-time
          description: When the package was uploaded to OpenRepo.
      required:
      - architecture
      - checksum_sha512
      - filename
      - package_name
      - package_uid
      - repo_uid
      - upload_date
      - version
