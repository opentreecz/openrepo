    RepoTypeEnum:
      enum:
      - deb
      - rpm
      - apk
      - files
      type: string
      description: |-
        * `deb` - Debian/APT
        * `rpm` - Red Hat/RPM
        * `apk` - Alpine/APK
        * `files` - Generic Files
    RetentionPolicyEnum:
      enum:
      - none
      - keep_latest_n
      - max_age_days
      - keep_latest_n_and_age
      type: string
      description: |-
        * `none` - Keep everything
        * `keep_latest_n` - Keep latest N versions
        * `max_age_days` - Delete packages older than N days
        * `keep_latest_n_and_age` - Keep latest N versions OR delete older than N days
