openapi: 3.0.3
info:
  title: OpenRepo API
  version: 2.9.2
  description: Package repository management API for Debian APT, RPM, Alpine APK,
    and generic file repositories.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
paths:
  /api/{repo_uid}/:
    get:
      operationId: root_retrieve
      description: Retrieve full repository detail and configuration.
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - repos
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoDetail'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: You do not have permission to perform this action.
    put:
      operationId: root_update
      description: Update repository configuration (full replace).
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - repos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepoDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RepoDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RepoDetailRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoDetail'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: You do not have permission to perform this action.
    patch:
      operationId: root_partial_update
      description: Partially update repository configuration.
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - repos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRepoDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRepoDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRepoDetailRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoDetail'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: You do not have permission to perform this action.
    delete:
      operationId: root_destroy
      description: Delete a repository and all its packages.
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - repos
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: You do not have permission to perform this action.
  /api/{repo_uid}/packages/:
    get:
      operationId: packages_list
      description: List packages in a repository. Supports filtering, search, and
        ordering.
      parameters:
      - in: query
        name: architecture
        schema:
          type: string
      - in: query
        name: checksum_sha512
        schema:
          type: string
      - in: query
        name: filename__icontains
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: package_name
        schema:
          type: string
      - in: query
        name: package_name__icontains
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: repo_uid
        schema:
          type: string
        description: Repository identifier.
        required: true
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: version
        schema:
          type: string
      tags:
      - packages
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPackageSummaryList'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: You do not have permission to perform this action.
  /api/{repo_uid}/pkg/{package_uid}/:
    get:
      operationId: pkg_retrieve
      description: Retrieve full package detail.
      parameters:
      - in: path
        name: package_uid
        schema:
          type: string
        required: true
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - packages
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDetail'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: You do not have permission to perform this action.
    put:
      operationId: pkg_update
      description: Update package metadata (full replace).
      parameters:
      - in: path
        name: package_uid
        schema:
          type: string
        required: true
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - packages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PackageDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PackageDetailRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDetail'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: You do not have permission to perform this action.
    patch:
      operationId: pkg_partial_update
      description: Partially update package metadata.
      parameters:
      - in: path
        name: package_uid
        schema:
          type: string
        required: true
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - packages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPackageDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPackageDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPackageDetailRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDetail'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: You do not have permission to perform this action.
    delete:
      operationId: pkg_destroy
      description: Delete a package from the repository.
      parameters:
      - in: path
        name: package_uid
        schema:
          type: string
        required: true
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - packages
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: You do not have permission to perform this action.
  /api/{repo_uid}/pkg/{package_uid}/copy/:
    post:
      operationId: pkg_copy_create
      description: Copy a package to another repository.
      parameters:
      - in: path
        name: package_uid
        schema:
          type: string
        required: true
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - packages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CopyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CopyRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDetail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: You do not have permission to perform this action.
  /api/{repo_uid}/upload/:
    post:
      operationId: upload_create
      description: Upload a package file. Returns a task ID for async status polling.
        Returns 409 if the package already exists and overwrite is not set.
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: You do not have permission to perform this action.
  /api/buildlogs/:
    get:
      operationId: buildlogs_list
      description: List build log lines. Supports filtering by build, repo, log level,
        and time range.
      parameters:
      - in: query
        name: build
        schema:
          type: integer
        description: Filter by build number.
      - in: query
        name: loglevel
        schema:
          type: string
      - in: query
        name: max_line
        schema:
          type: integer
        description: Maximum line number (inclusive).
      - in: query
        name: max_time
        schema:
          type: string
          format: date-time
        description: Latest log line timestamp (ISO 8601).
      - in: query
        name: min_line
        schema:
          type: integer
        description: Minimum line number (inclusive).
      - in: query
        name: min_time
        schema:
          type: string
          format: date-time
        description: Earliest log line timestamp (ISO 8601).
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: repo
        schema:
          type: string
        description: Filter by repository UID.
      tags:
      - builds
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBuildLogList'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: You do not have permission to perform this action.
  /api/builds/:
    get:
      operationId: builds_list
      description: List repository builds. Supports filtering by repo, build number,
        and time range.
      parameters:
      - in: query
        name: build_number
        schema:
          type: integer
      - in: query
        name: completion_status
        schema:
          type: string
          x-spec-enum-id: 3d4790721c6c9fc0
          enum:
          - complete_fail
          - complete_success
          - running
        description: |-
          * `running` - Running
          * `complete_success` - Completed Successfully
          * `complete_fail` - Failed
      - in: query
        name: max_build
        schema:
          type: integer
        description: Maximum build number (inclusive).
      - in: query
        name: max_time
        schema:
          type: string
          format: date-time
        description: Latest build timestamp (ISO 8601).
      - in: query
        name: min_build
        schema:
          type: integer
        description: Minimum build number (inclusive).
      - in: query
        name: min_time
        schema:
          type: string
          format: date-time
        description: Earliest build timestamp (ISO 8601).
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: repo
        schema:
          type: string
        description: Filter by repository UID.
      tags:
      - builds
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBuildList'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: You do not have permission to perform this action.
  /api/health/:
    get:
      operationId: health_retrieve
      description: |-
        Unauthenticated health check endpoint.

        Returns database connectivity status and the application version.
        Intended for monitoring systems and load balancer probes.
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 2.5.0
                  repos:
                    type: integer
                    example: 5
                  packages:
                    type: integer
                    example: 142
          description: ''
  /api/repos/:
    get:
      operationId: repos_list
      description: List all repositories.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: repo_type
        schema:
          type: string
          x-spec-enum-id: 80fba3f307cafbc7
          enum:
          - apk
          - deb
          - files
          - rpm
        description: |-
          * `deb` - Debian/APT
          * `rpm` - Red Hat/RPM
          * `apk` - Alpine/APK
          * `files` - Generic Files
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - repos
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRepoSummaryList'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: You do not have permission to perform this action.
    post:
      operationId: repos_create
      description: Create a new repository.
      tags:
      - repos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepoDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RepoDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RepoDetailRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoDetail'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: You do not have permission to perform this action.
  /api/repos/{repo_uid}/:
    get:
      operationId: repos_retrieve
      description: Retrieve a repository summary.
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - repos
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoSummary'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: You do not have permission to perform this action.
    put:
      operationId: repos_update
      description: Update a repository (full replace).
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - repos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepoSummaryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RepoSummaryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RepoSummaryRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoSummary'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: You do not have permission to perform this action.
    patch:
      operationId: repos_partial_update
      description: Partially update a repository.
      parameters:
      - in: path
        name: repo_uid
        schema:
          type: string
        required: true
      tags:
      - repos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRepoSummaryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRepoSummaryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRepoSummaryRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoSummary'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
