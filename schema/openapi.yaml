components:
  schemas:
    Build:
      type: object
      properties:
        repo_uid:
          type: string
        timestamp:
          type: string
          format: date-time
          readOnly: true
        build_number:
          type: integer
        completion_status:
          $ref: '#/components/schemas/CompletionStatusEnum'
        total_duration_sec:
          type: number
          format: double
          nullable: true
      required:
      - build_number
      - repo_uid
      - timestamp
    BuildLog:
      type: object
      properties:
        build:
          type: integer
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        command:
          type: string
        message:
          type: string
        loglevel:
          type: string
          maxLength: 128
        line_number:
          type: integer
        execution_time_sec:
          type: number
          format: double
          nullable: true
        exec_complete:
          type: boolean
      required:
      - command
      - line_number
      - loglevel
      - timestamp
    CompletionStatusEnum:
      enum:
      - running
      - complete_success
      - complete_fail
      type: string
      description: |-
        * `running` - Running
        * `complete_success` - Completed Successfully
        * `complete_fail` - Failed
    CopyRequest:
      type: object
      properties:
        dest_repo_uid:
          type: string
          minLength: 1
      required:
      - dest_repo_uid
    ErrorResponse:
      type: object
      description: Standard error envelope returned by all API error responses.
      properties:
        code:
          type: string
          description: Machine-readable error code (e.g. PACKAGE_EXISTS)
        detail:
          type: string
          description: Human-readable error description
        status:
          type: integer
          description: HTTP status code
      required:
      - code
      - detail
      - status
    PGPKey:
      type: object
      properties:
        name:
          type: string
          maxLength: 65536
        email:
          type: string
          maxLength: 2048
        fingerprint:
          type: string
          maxLength: 65535
        creation_date:
          type: string
          format: date-time
          readOnly: true
        href:
          type: string
          format: uri
          readOnly: true
      required:
      - creation_date
      - email
      - fingerprint
      - href
      - name
    PGPKeyCreateRequestRequest:
      type: object
      description: Request body for generating a new PGP signing key.
      properties:
        name:
          type: string
          minLength: 1
          description: Full name for the PGP key (1-1024 characters)
        email:
          type: string
          format: email
          minLength: 1
          description: Email address for the PGP key
      required:
      - email
      - name
    PGPKeyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 65536
        email:
          type: string
          minLength: 1
          maxLength: 2048
        fingerprint:
          type: string
          minLength: 1
          maxLength: 65535
      required:
      - email
      - fingerprint
      - name
    PackageDetail:
      type: object
      properties:
        package_uid:
          type: string
          maxLength: 65536
        repo_uid:
          type: string
          readOnly: true
        filename:
          type: string
          maxLength: 65536
        version:
          type: string
          maxLength: 65536
        architecture:
          type: string
          pattern: ^[a-zA-Z0-9_.+-]+$
          maxLength: 256
        checksum_sha512:
          type: string
          maxLength: 512
        build_date:
          type: string
          format: date-time
          nullable: true
        upload_date:
          type: string
          format: date-time
      required:
      - architecture
      - checksum_sha512
      - filename
      - package_uid
      - repo_uid
      - upload_date
      - version
    PackageDetailRequest:
      type: object
      properties:
        package_uid:
          type: string
          minLength: 1
          maxLength: 65536
        filename:
          type: string
          minLength: 1
          maxLength: 65536
        version:
          type: string
          minLength: 1
          maxLength: 65536
        architecture:
          type: string
          minLength: 1
          pattern: ^[a-zA-Z0-9_.+-]+$
          maxLength: 256
        checksum_sha512:
          type: string
          minLength: 1
