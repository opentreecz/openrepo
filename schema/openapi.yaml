          description: Unique identifier slug for the repository.
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
          maxLength: 1024
        repo_type:
          enum:
          - deb
          - rpm
          - apk
          - files
          type: string
          x-spec-enum-id: 80fba3f307cafbc7
          description: |-
            Package format: deb, rpm, apk, or files.

            * `deb` - Debian/APT
            * `rpm` - Red Hat/RPM
            * `apk` - Alpine/APK
            * `files` - Generic Files
        package_count:
          type: integer
