name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Upload package '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of OpenRepo is affected?
      options:
        - Web UI (Frontend)
        - REST API (Backend)
        - CLI Tool
        - Repository Generation (Worker)
        - Docker / Deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: repo-type
    attributes:
      label: Repository Type
      description: Which repository type is affected (if applicable)?
      options:
        - Debian/APT (deb)
        - Red Hat/RPM
        - Generic Files
        - N/A
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: OpenRepo Version
      description: Which version or commit SHA are you running?
      placeholder: "e.g., v1.2.0, latest, or commit SHA"
    validations:
      required: false

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      description: How is OpenRepo deployed?
      options:
        - Docker Compose
        - Docker (manual)
        - Bare-metal (systemd)
        - Bare-metal (other)
        - Development environment
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Any additional environment details (OS, browser, architecture, etc.)
      placeholder: |
        - OS: Ubuntu 24.04
        - Browser: Firefox 128
        - Architecture: amd64
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant log output (Django logs, browser console, etc.)
      render: shell
    validations:
      required: false
