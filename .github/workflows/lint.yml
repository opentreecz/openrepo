name: Lint

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  python-lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Install flake8
        run: pip install -r web/dev-requirements.txt

      - name: flake8 web/
        working-directory: web
        run: flake8 --config=.flake8 .

      - name: flake8 cli/
        working-directory: cli
        run: flake8 --config=.flake8 .

  frontend-lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        # Non-blocking: the existing codebase predates strict typing and
        # has a pre-existing backlog of type errors unrelated to any given
        # change. Surface it in CI output without failing the build until
        # that backlog is paid down.
        continue-on-error: true
        run: npm run type-check

      - name: ESLint
        working-directory: frontend
        run: npm run lint
