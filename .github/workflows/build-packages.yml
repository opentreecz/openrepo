name: Build Packages (DEB/RPM)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (without v prefix)'
        required: true
        default: '0.0.1'

jobs:
  build-deb:
    name: Build DEB Package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
          - arch: armhf
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3

      - name: Build DEB package
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:/src \
            -w /src \
            -e OPENREPO_VERSION=${{ steps.version.outputs.version }} \
            ubuntu:24.04 bash -c '
              set -euo pipefail

              export DEBIAN_FRONTEND=noninteractive

              apt-get update && apt-get install -y \
                build-essential \
                python3 python3-venv python3-pip \
                nodejs npm libapt-pkg-dev libffi-dev libpq-dev curl

              rm -rf /tmp/openrepo-deb
              mkdir -p \
                /tmp/openrepo-deb/DEBIAN \
                /tmp/openrepo-deb/opt/openrepo \
                /tmp/openrepo-deb/lib/systemd/system \
                /tmp/openrepo-deb/etc/nginx/sites-available \
                /tmp/openrepo-deb/etc/openrepo \
                /tmp/openrepo-deb/var/lib/openrepo/storage \
                /tmp/openrepo-deb/var/lib/openrepo/repos \
                /tmp/openrepo-deb/var/lib/openrepo/keyring

              cd frontend
              npm ci
              npm run build
              cd /src

              python3 -m venv /tmp/openrepo-deb/opt/openrepo/venv
              PIP_CONSTRAINT=web/constraints.txt /tmp/openrepo-deb/opt/openrepo/venv/bin/pip install --no-cache-dir -r web/requirements.txt

              cp -r web/* /tmp/openrepo-deb/opt/openrepo/
              cp -r frontend/dist /tmp/openrepo-deb/opt/openrepo/frontend-dist
              cp packaging/systemd/openrepo-web.service /tmp/openrepo-deb/lib/systemd/system/
              cp packaging/systemd/openrepo-worker.service /tmp/openrepo-deb/lib/systemd/system/
              cp deploy/nginx/nginx.conf.prod /tmp/openrepo-deb/etc/nginx/sites-available/openrepo
              cp .env.example /tmp/openrepo-deb/etc/openrepo/openrepo.env

              cat > /tmp/openrepo-deb/DEBIAN/control <<EOF
Package: openrepo
Version: $OPENREPO_VERSION-1
Section: web
Priority: optional
Architecture: ${{ matrix.arch }}
Maintainer: opentree.cz <info@opentree.cz>
Depends: python3 (>= 3.10), python3-venv, nginx, postgresql, createrepo-c, gnupg, libapt-pkg-dev, gunicorn
Description: Web-based package repository management server
 OpenRepo is a self-hosted web server for managing and hosting
 Debian apt/deb, Red Hat rpm, and generic file repositories.
EOF

              mkdir -p /src/dist
              dpkg-deb --build /tmp/openrepo-deb /src/dist/openrepo_${OPENREPO_VERSION}-1_${{ matrix.arch }}.deb
            '

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrepo-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  build-rpm:
    name: Build RPM Package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7hl
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: matrix.arch != 'x86_64'
        uses: docker/setup-qemu-action@v3

      - name: Build RPM package
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:/src \
            -w /src \
            -e VERSION=${{ steps.version.outputs.version }} \
            fedora:40 bash -c '
              set -euo pipefail

              dnf install -y rpm-build rpmdevtools git python3-devel libffi-devel postgresql-devel apt-devel nodejs npm createrepo_c

              # Set up rpmbuild directory
              rpmdev-setuptree

              # Create source tarball
              mkdir -p openrepo-${VERSION}
              cp -r web frontend cli deploy packaging .env.example openrepo-${VERSION}/
              tar czf ~/rpmbuild/SOURCES/openrepo-${VERSION}.tar.gz openrepo-${VERSION}

              # Build the RPM
              rpmbuild -bb --define "version ${VERSION}" packaging/rpm/openrepo.spec

              # Move artifacts
              mkdir -p /src/dist
              find ~/rpmbuild/RPMS -name "*.rpm" -exec cp {} /src/dist/ \;
              test -n "$(find /src/dist -name "*.rpm" -print -quit)"
            '

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrepo-rpm-${{ matrix.arch }}
          path: dist/*.rpm
          if-no-files-found: error

  release:
    name: Attach to Release
    needs: [build-deb, build-rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
