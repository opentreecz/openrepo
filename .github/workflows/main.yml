name: CI

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Weekly run against latest PyPI releases / apt packages / python-apt
    # commit on the pinned ubuntu:24.04 base image, to catch drift even when
    # nothing in this repo has changed.
    - cron: '11 4 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    # Pinned to the same base image as the Dockerfile and build-packages.yml
    # (ubuntu:24.04). python-apt's compiled extension is tightly coupled to
    # the libapt-pkg ABI of the OS it's built against, so testing on
    # whatever OS "ubuntu-latest" happens to be this month can break on
    # ABI/toolchain drift unrelated to this repo. Running the actual test
    # matrix against the same base image we ship keeps that drift out of
    # the way of ordinary pushes/PRs.
    container: ubuntu:24.04

    env:
      OPENREPO_VAR_DIR: /tmp/openrepo/
      OPENREPO_SECRET_KEY: test-secret-key-for-ci-only
      OPENREPO_DISABLE_THROTTLE: "1"
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            apt-utils \
            build-essential \
            createrepo-c \
            git \
            gpg \
            libapt-pkg-dev \
            libpq-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv

      - uses: actions/checkout@v7

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          pip install ./openrepo_adapters
          pip install -r web/requirements.txt

      - name: Install coverage
        run: pip install coverage

      - name: Prepare var directory
        run: mkdir -p /tmp/openrepo/packages /tmp/openrepo/keyring /tmp/openrepo/www /tmp/openrepo/rpmcache

      - name: Run tests with coverage
        working-directory: web
        run: |
          coverage run manage.py test repo.tests --verbosity=2
          coverage report --show-missing --fail-under=85
          coverage xml -o coverage.xml

      - name: Validate OpenAPI schema
        working-directory: web
        run: python manage.py spectacular --validate --fail-on-warn

      - name: Regenerate and check schema/openapi.yaml
        working-directory: web
        run: |
          python manage.py spectacular --file ../schema/openapi.yaml
          if ! git diff --quiet ../schema/openapi.yaml; then
            echo "::warning::schema/openapi.yaml was out of date and has been regenerated."
            echo "The schema file has been updated in this run."
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: web/coverage.xml

  cli-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install CLI dependencies
        working-directory: cli
        run: pip install -r requirements.txt

      - name: Run CLI tests
        working-directory: cli
        run: PYTHONPATH=. python tests/test_cli.py
