[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openrepo-adapters"
version = "0.1.0"
description = "Package metadata extraction for .deb, .rpm, .apk, and generic files"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = []

[project.optional-dependencies]
deb = ["python-apt>=2.0"]
rpm = ["rpmfile>=2.0", "python-dateutil>=2.8"]
all = ["python-apt>=2.0", "rpmfile>=2.0", "python-dateutil>=2.8"]
dev = ["pytest>=7.0"]
