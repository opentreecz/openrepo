<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   version="1.1"
   width="520"
   height="160"
   viewBox="0 0 520 160"
   xmlns="http://www.w3.org/2000/svg">
  <g>
    <!-- badge -->
    <rect x="10" y="20" width="120" height="120" rx="28" fill="#f57f17" />
    <!-- open-box glyph -->
    <rect x="39" y="58" width="62" height="44" rx="7"
          fill="none" stroke="#ffffff" stroke-width="8" />
    <line x1="39" y1="58" x2="22" y2="38" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <line x1="101" y1="58" x2="118" y2="38" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <!-- wordmark (light text for dark backgrounds) -->
    <text
       x="155"
       y="104"
       style="font-family:Arial, Helvetica, sans-serif;font-weight:700;font-size:72px;letter-spacing:-1px">
      <tspan fill="#ffffff">Open</tspan><tspan fill="#f57f17">Repo</tspan>
    </text>
  </g>
</svg>
