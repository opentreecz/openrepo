# =============================================================================
# OpenRepo — Docker Compose Configuration
# =============================================================================
#
# Quick start:
#   1. cp .env.example .env && $EDITOR .env     # set OPENREPO_SECRET_KEY
#   2. docker compose up -d                      # start all services
#   3. docker compose exec django ./django/manage.py createsuperuser
#   4. Open http://localhost:7376
#
# Architecture:
#   nginx (8080)  -->  django/gunicorn (8000)  -->  db/postgres (5432)
#                                               <--  worker (background)
#
# All app containers (nginx, django, worker, beat) use the same Docker
# image with different commands.
#
# Every ${VAR:-default} below has a working default.  Override any of them
# in .env (see .env.example) — values in .env always win over the defaults.  The shared data volume at
# /var/lib/openrepo holds packages, repo metadata, and GPG keyrings.
# =============================================================================

# Shared environment for django, worker and beat.  Each value defaults to the
# shown fallback and can be overridden in .env.
x-openrepo-env: &openrepo-env
  OPENREPO_DB_TYPE: ${OPENREPO_DB_TYPE:-postgresql}
  OPENREPO_PG_DATABASE: ${OPENREPO_PG_DATABASE:-openrepo}
  OPENREPO_PG_USERNAME: ${OPENREPO_PG_USERNAME:-postgres}
  OPENREPO_PG_PASSWORD: ${OPENREPO_PG_PASSWORD:-postgres}
  OPENREPO_PG_HOSTNAME: ${OPENREPO_PG_HOSTNAME:-db}
  OPENREPO_PG_PORT: ${OPENREPO_PG_PORT:-5432}
  OPENREPO_PG_CONN_MAX_AGE: ${OPENREPO_PG_CONN_MAX_AGE:-300}
  # REQUIRED — server refuses to start without this.
  OPENREPO_SECRET_KEY: ${OPENREPO_SECRET_KEY:-${DJANGO_SECRET_KEY:-}}
  # Celery broker/result backend.  Must point at a reachable Redis.
  OPENREPO_REDIS_URL: ${OPENREPO_REDIS_URL:-redis://redis:6379/0}
  OPENREPO_DEBUG: ${OPENREPO_DEBUG:-FALSE}
  OPENREPO_DOMAIN: ${OPENREPO_DOMAIN:-localhost:8080}
  OPENREPO_ALLOWED_HOSTS: ${OPENREPO_ALLOWED_HOSTS:-}
  OPENREPO_CSRF_TRUSTED_ORIGINS: ${OPENREPO_CSRF_TRUSTED_ORIGINS:-}
  OPENREPO_MAX_UPLOAD_SIZE: ${OPENREPO_MAX_UPLOAD_SIZE:-2147483648}
  OPENREPO_LOGLEVEL: ${OPENREPO_LOGLEVEL:-INFO}
  OPENREPO_DISABLE_THROTTLE: ${OPENREPO_DISABLE_THROTTLE:-0}
  OPENREPO_USE_PYTHON_TOOLS: ${OPENREPO_USE_PYTHON_TOOLS:-0}
  RPM_VERSION_IGNORE_BUILD_NUM: ${RPM_VERSION_IGNORE_BUILD_NUM:-false}
  OPENREPO_REBUILD_QUEUED_TTL: ${OPENREPO_REBUILD_QUEUED_TTL:-300}
  OPENREPO_STALE_CHECK_INTERVAL: ${OPENREPO_STALE_CHECK_INTERVAL:-60}
  OPENREPO_LOG_PERIODIC_TASKS: ${OPENREPO_LOG_PERIODIC_TASKS:-0}
  OPENREPO_REPO_DELETE_LOCK_TIMEOUT: ${OPENREPO_REPO_DELETE_LOCK_TIMEOUT:-120}

services:

  # ---------------------------------------------------------------------------
  # Nginx — reverse proxy, serves the Vue.js SPA and hosted repo files
  # ---------------------------------------------------------------------------
  nginx:
    build: .
    image: ${OPENREPO_IMAGE:-ghcr.io/opentreecz/openrepo:latest}
    command: nginx
    restart: unless-stopped
    ports:
      - "${OPENREPO_PORT:-7376}:8080"
    depends_on:
      django:
        condition: service_healthy
    volumes:
      - openrepo-data:/var/lib/openrepo
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Django — REST API (Gunicorn + gevent), handles uploads, manages repos
  # ---------------------------------------------------------------------------
  django:
    build: .
    image: ${OPENREPO_IMAGE:-ghcr.io/opentreecz/openrepo:latest}
    expose:
      - "8000"
    command: run_openrepoweb
    restart: unless-stopped
    volumes:
      - openrepo-data:/var/lib/openrepo
    environment:
      <<: *openrepo-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/app/django/manage.py migrate --check"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Worker — Celery worker: upload processing, repo rebuilds, retention sweeps
  # ---------------------------------------------------------------------------
  worker:
    build: .
    image: ${OPENREPO_IMAGE:-ghcr.io/opentreecz/openrepo:latest}
    # Run from /app/django so the "openrepo" Celery app module is importable.
    working_dir: /app/django
    command: ["sh", "-c", "exec celery -A openrepo worker -l \"$${OPENREPO_LOGLEVEL:-INFO}\" --concurrency=\"$${OPENREPO_WORKER_CONCURRENCY:-4}\""]
    restart: unless-stopped
    volumes:
      - openrepo-data:/var/lib/openrepo
    environment:
      <<: *openrepo-env
      OPENREPO_WORKER_CONCURRENCY: ${OPENREPO_WORKER_CONCURRENCY:-4}
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cd /app/django && celery -A openrepo inspect ping >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Beat — periodic task scheduler (retention sweeps, stale repo polling)
  # ---------------------------------------------------------------------------
  beat:
    build: .
    image: ${OPENREPO_IMAGE:-ghcr.io/opentreecz/openrepo:latest}
    working_dir: /app/django
    command: ["sh", "-c", "exec celery -A openrepo beat -l \"$${OPENREPO_LOGLEVEL:-INFO}\" --schedule=/tmp/celerybeat-schedule"]
    restart: unless-stopped
    environment:
      <<: *openrepo-env
    depends_on:
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Redis — message broker for Celery task queue
  # ---------------------------------------------------------------------------
  redis:
    image: ${OPENREPO_REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # PostgreSQL — relational database
  # ---------------------------------------------------------------------------
  db:
    image: ${OPENREPO_POSTGRES_IMAGE:-postgres:16-alpine}
    expose:
      - "5432"
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${OPENREPO_PG_PASSWORD:-postgres}
      POSTGRES_USER: ${OPENREPO_PG_USERNAME:-postgres}
      POSTGRES_DB: ${OPENREPO_PG_DATABASE:-openrepo}
    volumes:
      - openrepo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'"]
      interval: 10s
      timeout: 5s
      retries: 5

# =============================================================================
# Persistent volumes
# =============================================================================
volumes:
  # Package files, repo metadata (www/), GPG keyrings, caches
  openrepo-data:
  # PostgreSQL database files
  openrepo-db:
